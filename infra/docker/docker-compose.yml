version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: opportunityscout-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opportunityscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-opportunityscout}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-opportunityscout}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: run all services in Docker
  # api:
  #   build:
  #     context: ../../services/api
  #     dockerfile: Dockerfile
  #   container_name: opportunityscout-api
