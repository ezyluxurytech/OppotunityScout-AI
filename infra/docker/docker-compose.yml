  #     postgres:
  #       condition: service_healthy
  #   env_file: ../../services/api/.env
  #   ports:
  #     - '4000:4000'

  # ai:
  #   build:
  #     context: ../../services/ai
  #     dockerfile: Dockerfile
  #   container_name: opportunityscout-ai
  #   env_file: ../../services/ai/.env
  #   ports:
  #     - '8000:8000'

volumes:
  postgres_data:
